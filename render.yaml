services:
  - type: web
    name: company-a-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run python -m app.seed && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: company-a-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: SEED_PASSWORD
        sync: false

databases:
  - name: company-a-db
    plan: free
    databaseName: dealer
